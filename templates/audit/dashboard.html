{% extends "base.html" %}

{% block content %}
<div class="flex flex-wrap items-center justify-between gap-4 pb-6 mb-6 border-b border-slate-800">
  <div>
    <h1 class="text-3xl font-black text-white">{{ wall.name }}</h1>
    <p class="text-sm text-slate-400 mt-1">
      מצלמה פעילה: אינדקס #{{ wall.camera_index }} ({{ wall.frame_width }}x{{ wall.frame_height }}) · ייצוב פוקוס: {{ wall.warmup_frames }} פריימים
    </p>
  </div>

  <div class="flex flex-wrap items-center gap-4">
    <!-- בקרת סריקה אוטומטית -->
    <div class="flex items-center gap-3 bg-slate-800/90 border border-slate-700 px-4 py-2.5 rounded-xl shadow">
      <label class="flex items-center gap-2 cursor-pointer select-none">
        <input type="checkbox" id="auto-scan-toggle" checked
               class="w-4 h-4 accent-emerald-500 rounded cursor-pointer">
        <span class="text-sm font-bold text-slate-200">סריקה אוטומטית</span>
      </label>

      <select id="auto-scan-interval"
              class="bg-slate-900 border border-slate-700 text-xs text-slate-200 rounded-lg px-2.5 py-1.5 font-mono">
        <option value="10000">כל 10 שניות</option>
        <option value="20000" selected>כל 20 שניות</option>
        <option value="30000">כל 30 שניות</option>
        <option value="60000">כל דקה</option>
      </select>

      <span id="auto-scan-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping" title="סריקה אוטומטית פעילה"></span>
    </div>

    <!-- טופס הסריקה של HTMX (מופעל ידנית או אוטומטית על ידי הטיימר) -->
    <form id="scan-form"
          hx-post="{% url 'run_scan' %}"
          hx-target="#audit-workspace"
          hx-indicator="#scan-spinner"
          hx-sync="this:drop">
      {% csrf_token %}
      <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-6 py-3 rounded-xl shadow-lg flex items-center gap-2 cursor-pointer transition">
        <span>סרוק קיר עכשיו</span>
        <span id="scan-spinner" class="htmx-indicator animate-spin">⏳</span>
      </button>
    </form>
  </div>
</div>

<div id="audit-workspace">
  {% include "audit/partials/workspace.html" %}
</div>

<script>
(function() {
  const toggle = document.getElementById('auto-scan-toggle');
  const intervalSelect = document.getElementById('auto-scan-interval');
  const form = document.getElementById('scan-form');
  const dot = document.getElementById('auto-scan-dot');
  let timer = null;

  function triggerAutoScan() {
    // מפעיל סריקה רק אם הטאב גלוי ואין כרגע סריקה פעילה שרצה
    if (toggle.checked && !document.hidden && !form.classList.contains('htmx-request')) {
      htmx.trigger(form, 'submit');
    }
  }

  function restartTimer() {
    if (timer) clearInterval(timer);
    if (toggle.checked) {
      dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping";
      timer = setInterval(triggerAutoScan, parseInt(intervalSelect.value, 10));
    } else {
      dot.className = "w-2.5 h-2.5 rounded-full bg-slate-600";
    }
  }

  toggle.addEventListener('change', restartTimer);
  intervalSelect.addEventListener('change', restartTimer);

  // הפעלה ראשונית בטעינת העמוד
  restartTimer();
})();
</script>
{% endblock %}
